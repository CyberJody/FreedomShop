{% block extra_style %}<style>.catalog-form{padding:14px}.catalog-grid{max-width:900px;display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:14px}.catalog-grid label{display:block;font-size:13px;margin-bottom:5px}.catalog-grid input:not([type=checkbox]),.catalog-grid select,.catalog-grid textarea{width:100%;box-sizing:border-box;font:inherit;padding:5px}.success{background:#e7f5d6;color:#365424;padding:10px 12px}.printer-status{font-weight:600}.printer-status.ok{color:#2f6b2f}.printer-status.bad{color:#a12b2b}.printer-actions{display:flex;gap:6px;flex-wrap:wrap}.printer-actions .button{padding:4px 10px}@media(max-width:620px){.catalog-grid{grid-template-columns:1fr}}</style>{% endblock %}
