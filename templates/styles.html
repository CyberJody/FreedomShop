<style>
/* Default green theme. */
:root{--brand-green:#1b4b34;--brand-green-dark:#133725;--brand-border:#b8cec0;--brand-hover:#dcecdf;--brand-tint:#e7f0e9;--brand-surface:#f4f8f5}

*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:#e7e7e7;color:#171717;font:14px Arial,Helvetica,sans-serif}button,input{font:inherit}button:disabled{opacity:1;cursor:default}button{color:inherit}.sprite{position:absolute;width:0;height:0;overflow:hidden}
.titlebar{min-height:30px;display:flex;align-items:center;gap:8px;background:var(--brand-green);color:#fff;padding:0 10px;font-weight:bold;font-size:13px}.product-subtitle{font-size:12px;font-weight:normal}.brand{display:flex;flex-direction:column;line-height:1.15;padding:3px 0}.business-name{font-size:11px;font-weight:normal;opacity:.9}.title-icon{width:18px;height:18px}.menubar{display:flex;align-items:center;gap:0;min-height:32px;background:linear-gradient(#fafafa,#e0e0e0);border-bottom:1px solid #b8b8b8;padding:0 4px}.menubar button{border:0;background:transparent;padding:7px 9px;color:#444}.menubar-status{margin-left:auto;padding:0 12px;font-size:12px}
.toolbar{display:flex;align-items:center;height:40px;background:#fff;border-bottom:1px solid #b7b7b7}.tabs{display:flex;width:280px;flex-shrink:0;height:100%}.tab{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#fff,#d8d8d8);border:0;border-right:1px solid #b8b8b8;color:var(--brand-green);font-weight:bold}.tab svg{width:25px;height:25px}.home-tab{width:104px}.windows-tab{flex:1}.caret{font-size:10px;margin-left:8px}.want{margin-left:13px;background:var(--brand-green);border:1px solid var(--brand-green-dark);color:white;padding:5px 9px;border-radius:3px;font-weight:bold;white-space:nowrap}.search{margin:0 22px 0 auto;display:flex;align-items:center;gap:9px;width:min(55%,690px);padding-left:18px;color:var(--brand-green)}.search input{width:100%;min-width:0;border:1px solid #b9bfc8;border-radius:3px;height:27px;padding:3px 10px;font-style:italic;background:#fff;color:#777}
.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 127px)}aside{padding:17px 21px;background:#e7e7e7;border-right:2px solid #c2c5ca}.shortcut{display:block;width:100%;height:50px;margin-bottom:9px;border:1px solid var(--brand-green-dark);border-radius:4px;color:#fff;background:var(--brand-green);font-weight:bold;text-shadow:none;box-shadow:inset 0 1px #ffffff26;font-size:14px}.shortcut.gold{background:linear-gradient(#f6d46a,#d4a017);border-color:#9a7310;color:#2b2000;gap:8px}.shortcut.gold:hover{background:linear-gradient(#fbe08a,#e0ad22)}.shortcut-icon{width:22px;height:22px;flex:none}
main{min-width:0;background:#fff;padding:18px 17px 28px}h1{font-size:19px;margin:0 0 16px;padding:0 2px 5px;border-bottom:3px solid var(--brand-green);color:var(--brand-green)}.navigator{display:grid;grid-template-columns:27px minmax(0,1fr);border:1px solid var(--brand-border);border-radius:7px;overflow:hidden;margin-bottom:9px}.section-label{display:flex;align-items:center;justify-content:flex-end;writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 6px;background:var(--brand-green);color:white;font-size:12px;font-weight:bold}.task-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:149px;gap:0;padding:12px clamp(8px,3vw,55px);background:radial-gradient(ellipse at center,var(--brand-surface),var(--brand-tint))}.reminder-message{margin:0 0 10px;padding:8px 12px;border:1px solid #9fb6d6;background:#eef4fc;color:#1f3f72;border-radius:5px;font-size:14px}.reminder-message a{color:#1d4fa0;font-weight:bold}.task.col-4{grid-column:4}.task.col-1{grid-column:1}.task{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}.task button{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;width:100%;height:100%;border:0;background:transparent;padding:10px 4px;position:relative;z-index:1}.task-icon{width:68px;height:68px;filter:drop-shadow(2px 4px 2px #4e617749)}.task-label{font-size:18px;text-align:center;line-height:1.25}.task.right:after{content:'';position:absolute;width:clamp(18px,4vw,65px);height:9px;background:#81898b;clip-path:polygon(0 35%,83% 35%,83% 0,100% 50%,83% 100%,83% 65%,0 65%);top:48px;right:0;transform:translateX(50%);z-index:0}.task.down:before{content:'';position:absolute;border-left:2px dashed #929a9c;height:43px;top:125px;left:50%;z-index:0}.down-arrow{position:absolute;top:161px;left:calc(50% - 4px);border:5px solid transparent;border-top:7px solid #929a9c;z-index:0}.statusbar{height:25px;padding:5px 12px;background:linear-gradient(#f5f5f5,#dedede);border-top:1px solid #bababa;color:#646464;font-size:12px}.statusbar span{float:right}
@media(min-width:1400px){.workspace{grid-template-columns:300px minmax(0,1fr)}.tabs{width:300px}.task-grid{grid-auto-rows:158px;padding:18px 65px}.task-label{font-size:19px}.task.down:before{top:129px;height:48px}.down-arrow{top:170px}}
@media(max-width:900px){.workspace{grid-template-columns:205px minmax(0,1fr)}.tabs{width:205px}aside{padding:16px 12px}.task-grid{padding:10px 3px;grid-auto-rows:140px}.task-icon{width:59px;height:59px}.task-label{font-size:14px}.task.down:before{top:119px;height:38px}.down-arrow{top:150px}.task.right:after{width:22px;top:44px}.search{margin-right:12px;width:48%;padding-left:10px}.search label{display:none}.menubar-status{display:none}.want{font-size:12px;margin-left:9px}}
@media(max-width:620px){.task.col-4,.task.col-1{grid-column:auto}.toolbar{height:auto;min-height:40px;flex-wrap:wrap}.tabs{height:40px;width:205px}.search{width:100%;margin:8px 12px;padding:0}.workspace{grid-template-columns:145px minmax(0,1fr)}aside{padding:12px 7px}.shortcut{height:44px;font-size:12px}main{padding:13px 8px}.task-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.task.right:after,.task.down:before,.down-arrow{display:none}.task-label{font-size:13px}.menubar{flex-wrap:wrap}.menubar button{font-size:12px;padding:6px}.statusbar{height:auto;min-height:25px}.statusbar span{float:none;display:block;margin-top:3px}}
a{color:inherit}.menu-link{text-decoration:none;padding:7px 9px;color:#444}.shortcut{text-decoration:none;display:flex;align-items:center;justify-content:center}.task a{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;width:100%;height:100%;padding:10px 4px;text-decoration:none;position:relative;z-index:1}.task a:hover{background:#ffffff80;border-radius:6px}.shortcut:hover{filter:brightness(1.05)}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand-green);outline-offset:2px}

.windows-menu{flex:1}.windows-menu>summary{height:100%;color:var(--brand-green)}.windows-menu>div{max-height:70vh;overflow:auto}.home-actions>summary.want{padding:5px 9px;color:white}.pos-menu>div>button{width:100%;text-align:left;cursor:pointer;padding:9px 14px}.pos-menu>div>button:hover{background:var(--brand-hover)}.search select{max-width:150px;padding:4px;border:1px solid #b9bfc8;border-radius:3px;background:white}.search button{padding:4px 9px;border:1px solid var(--brand-border);background:linear-gradient(white,var(--brand-tint));border-radius:3px;cursor:pointer}.workflow-help{padding:10px 24px;overflow:auto;line-height:1.6;max-width:1000px}.workflow-help h2{font-size:18px;color:var(--brand-green)}.workflow-help a{color:var(--brand-green)}.pos-workspace aside{overflow:auto}
@media print{header,aside,footer,.list-tools,.paging,.customer-actions,.close-details,.saved-message{display:none!important}.customer-workspace,.workspace{display:block;height:auto;min-height:0}.customer-main{display:block}.customer-main .table-scroll{overflow:visible}.customer-details{max-height:none;overflow:visible}.customer-table th{position:static}.customer-table{white-space:normal}.customer-table td{max-width:none;overflow:visible}.customer-table{font-size:9px}.customer-table th,.customer-table td{padding:4px}.customer-details{break-inside:avoid}body{background:white}.workflow-help{overflow:visible}}
</style>
