<script>
(()=>{
'use strict';
const rows=document.getElementById('purchase-rows'),money=cents=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(cents)/100);
function units(value,places){if(!(places?new RegExp('^\\d+(?:\\.\\d{1,'+places+'})?$'):/^\d+(?:\.0+)?$/).test(value))return null;const [a,b='']=value.split('.');return BigInt(a)*10n**BigInt(places)+BigInt(b.padEnd(places,'0'));}
function update(){if(!rows)return;let sum=0n,valid=true;for(const row of rows.children){const q=units(row.querySelector('.quantity').value,0),c=units(row.querySelector('.cost').value,2),skip=row.querySelector('[name$="-DELETE"]').checked;
 // Due = Ordered - Received (never below 0), redrawn as Ordered is typed; new lines (Add Item) start with 0 received.
 const due=row.querySelector('.due');if(due){const got=units(row.querySelector('.received')?.dataset.received||'0',0)??0n;due.textContent=q===null?'—':String(q>got?q-got:0n);}
 if(skip){row.querySelector('.amount').textContent='Skipped';continue;}if(q===null || c===null){row.querySelector('.amount').textContent='—';valid=false;continue;}const amount=q*c;row.querySelector('.amount').textContent=money(amount);sum+=amount;}document.getElementById('purchase-total').textContent=valid?money(sum):'Enter quantities and costs';}
function wire(row){const search=row.querySelector('.item-search'),id=row.querySelector('[name$="-item"]'),results=row.querySelector('.results'),cost=row.querySelector('.cost');let timer,controller;search.addEventListener('input',()=>{id.value='';clearTimeout(timer);controller?.abort();results.replaceChildren();const q=search.value.trim();if(q.length<1)return;timer=setTimeout(async()=>{controller=new AbortController();try{const response=await fetch('/purchasing/lookup/items/?q='+encodeURIComponent(q)+'&vendor='+encodeURIComponent(document.querySelector('[name=vendor]').value),{signal:controller.signal});if(!response.ok)throw Error();const data=await response.json();if(search.value.trim()!==q)return;results.replaceChildren();for(const item of data.results){const b=document.createElement('button');b.type='button';b.textContent=item.label;b.addEventListener('click',()=>{id.value=item.id;search.value=item.label;row.querySelector('.purchase-description').value=item.description;cost.value=item.cost;results.replaceChildren();update();});results.append(b);}if(!data.results.length){const p=document.createElement('p');p.textContent='No matching items. Add a verified item first.';results.append(p);}}catch(e){if(e.name!=='AbortError'){results.textContent='Search unavailable. Try again.';}}},220);});search.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){results.querySelector('button')?.focus();e.preventDefault();}if(e.key==='Enter'){e.preventDefault();const matches=results.querySelectorAll('button');if(matches.length===1)matches[0].click();}if(e.key==='Escape')results.replaceChildren();});row.addEventListener('input',update);row.addEventListener('change',update);}
function appendItem(item){const count=document.getElementById('id_lines-TOTAL_FORMS'),n=Number(count.value);if(n>=100)return;const template=document.createElement('template');template.innerHTML=document.getElementById('empty-line').innerHTML.replaceAll('__prefix__',String(n));const row=template.content.firstElementChild;rows.append(row);count.value=n+1;row.querySelector('.quantity').value=item?.quantity||'1';wire(row);if(item){row.querySelector('[name$="-item"]').value=item.id;row.querySelector('.item-search').value=item.label;row.querySelector('.purchase-description').value=item.description;row.querySelector('.cost').value=item.cost;}else row.querySelector('.item-search').focus();row.dispatchEvent(new Event('input',{bubbles:true}));update();}
if(rows){for(const row of rows.children)wire(row);update();document.getElementById('add-line')?.addEventListener('click',()=>appendItem());document.querySelector('[data-open-item-picker]')?.addEventListener('click',()=>window.openItemPicker(items=>{for(const item of items){const blank=[...rows.children].find(r=>!r.querySelector('[name$="-item"]').value&&!r.querySelector('.item-search').value);if(blank){blank.querySelector('[name$="-item"]').value=item.id;blank.querySelector('.item-search').value=item.label;blank.querySelector('.purchase-description').value=item.description;blank.querySelector('.cost').value=item.cost;if(item.quantity)blank.querySelector('.quantity').value=item.quantity;blank.dispatchEvent(new Event('input',{bubbles:true}));}else appendItem(item);}update();},{quantity:true,vendor:document.querySelector('[name=vendor]').value,limit:100-Number(document.getElementById('id_lines-TOTAL_FORMS').value)+[...rows.children].filter(r=>!r.querySelector('[name$="-item"]').value&&!r.querySelector('.item-search').value).length}));}
for(const formId of ['purchase-form','cancel-form']){const form=document.getElementById(formId);if(!form)continue;let confirmed=false;form.addEventListener('submit',e=>{const button=e.submitter;if(!button)return;const flag=document.getElementById('print-flag');if(flag)flag.value=button.hasAttribute('data-print')?'1':'0';if(confirmed)return;if(button.value==='post'||button.value==='cancel'){e.preventDefault();const dialog=document.getElementById('purchase-confirm');dialog.returnValue='back';const heading=dialog.querySelector('h2');heading.dataset.title=heading.dataset.title||heading.textContent;heading.textContent=button.value==='cancel'&&dialog.dataset.kind==='po'?'Cancel Purchase Order':button.value==='cancel'&&dialog.dataset.kind==='voucher'&&dialog.dataset.status==='posted'?'Reverse Receiving Voucher':heading.dataset.title;document.getElementById('confirmation-text').textContent=button.value==='post'?'Record these items as received? This will update inventory and the purchase order.':(dialog.dataset.kind==='voucher'&&dialog.dataset.status==='posted'?/* */'Reverse '+(dialog.dataset.number||'this receiving voucher')+'? This takes its items back out of stock (and their cost back out of inventory value), and they are due again on the purchase order. Use this to fix a receiving mistake, then receive the items again.':(dialog.dataset.kind==='po'?/* */'Cancel '+(dialog.dataset.number||'this purchase order')+'? It will no longer be expected from the vendor.'+(Number(dialog.dataset.received||0)>0?' Items already received stay in stock.':''):'Cancel this held voucher? Stock will not change.'));dialog.addEventListener('close',()=>{if(dialog.returnValue==='confirm'){confirmed=true;form.requestSubmit(button);}},{once:true});dialog.showModal();}});}
const vendor=document.querySelector('[name=vendor]'),terms=document.querySelector('[name=terms]');
if(vendor && terms && document.getElementById('vendor-terms')){const defaults=JSON.parse(document.getElementById('vendor-terms').textContent);let previous=defaults[vendor.value]||'';vendor.addEventListener('change',()=>{if(!terms.value || terms.value===previous)terms.value=defaults[vendor.value]||'';previous=defaults[vendor.value]||'';terms.dispatchEvent(new Event('input',{bubbles:true}));});}

})();
document.getElementById('skip-all')?.addEventListener('change',e=>{document.querySelectorAll('#purchase-rows input[name$="-DELETE"]').forEach(c=>{c.checked=e.target.checked;c.dispatchEvent(new Event('change',{bubbles:true}));});});
</script>
