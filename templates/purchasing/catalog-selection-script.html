<script>(()=>{let selected=null;const section='{{ section }}';const shortcuts=document.querySelectorAll('[data-catalog-action]');function select(row){document.querySelectorAll('tr.catalog-selected').forEach(r=>r.classList.remove('catalog-selected'));row.classList.add('catalog-selected');selected=row.dataset.catalogId;document.getElementById('selected-count').textContent='1 selected';shortcuts.forEach(b=>b.disabled=false);}
function wire(row){if(row.dataset.wired)return;row.dataset.wired='1';row.tabIndex=0;if(row.dataset.catalogId===selected)row.classList.add('catalog-selected');row.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();select(row);});row.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();select(row);}if(e.key==='Enter'&&{{ can_edit|yesno:'true,false' }})location.href='/purchasing/'+section+'/'+row.dataset.catalogId+'/';});row.addEventListener('dblclick',()=>{if({{ can_edit|yesno:'true,false' }})location.href='/purchasing/'+section+'/'+row.dataset.catalogId+'/';});}
document.addEventListener('list-scroll:row',e=>{if(e.detail.record.details)e.detail.row.dataset.details=e.detail.record.details;});document.querySelectorAll('tr[data-catalog-id]').forEach(wire);document.addEventListener('list-scroll:render',()=>document.querySelectorAll('tr[data-catalog-id]').forEach(wire));
shortcuts.forEach(b=>b.onclick=()=>{if(!selected)return;const id=selected,action=b.dataset.catalogAction;if(action==='copy')location.href='/purchasing/'+section+'/new/?copy='+id;if(action==='edit')location.href='/purchasing/'+section+'/'+id+'/';if(action==='delete')location.href='/records/'+section+'/'+id+'/delete/';if(action==='details'){const row=document.querySelector('tr.catalog-selected');if(!row)return;const panel=document.getElementById('catalog-details');panel.hidden=!panel.hidden;panel.textContent=[...[...row.cells].map((c,i)=>document.querySelectorAll('thead th')[i].textContent.replace(/\s*[↑↓]$/,'')+': '+c.textContent.trim()),...(row.dataset.details?row.dataset.details.split('\n'):[])].join('\n');}});})();</script>
