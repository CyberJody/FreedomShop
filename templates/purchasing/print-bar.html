{% if doc %}<div class="export-bar no-print" id="doc-print-bar" data-print-url="/purchasing/{{ kind }}/{{ doc.token }}/print/" data-pdf-url="/purchasing/{{ kind }}/{{ doc.token }}/pdf/" {% if auto_print %}data-auto-print="1"{% endif %}><span class="label">Print {% if kind == 'po' %}Purchase Order{% else %}Receiving Voucher{% endif %}</span><a class="button" href="/purchasing/{{ kind }}/{{ doc.token }}/pdf/" target="_blank" rel="noopener">PDF</a><button class="button" type="button" id="doc-direct-print" {% if not printers %}disabled title="No Letter printers are set up"{% endif %}>Direct Print</button><select id="doc-printer" aria-label="Printer" {% if not printers %}disabled{% endif %}>{% for p in printers %}<option value="{{ p.pk }}" {% if selected_printer == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% empty %}<option value="">No Letter printers</option>{% endfor %}</select><span class="print-status" id="doc-print-status" role="status" hidden></span><form id="doc-print-csrf" hidden>{% csrf_token %}</form></div>
<style>.export-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#eee;border-bottom:1px solid #ccc;font-size:13px;flex-wrap:wrap}.export-bar .label{margin-right:4px;color:#485365}.export-bar select{padding:6px;min-width:200px;font:inherit;border:1px solid #aeb7c3;border-radius:2px;background:white}.export-bar .print-status{font-size:12px;color:#2f6b3f}.export-bar .print-status.bad{color:#923328}</style>
<script>
(()=>{const bar=document.getElementById('doc-print-bar');if(!bar)return;const button=document.getElementById('doc-direct-print'),select=document.getElementById('doc-printer'),status=document.getElementById('doc-print-status'),csrf=document.querySelector('#doc-print-csrf [name=csrfmiddlewaretoken]').value;
const show=(text,bad,link)=>{status.textContent=text;status.hidden=false;status.classList.toggle('bad',!!bad);if(link){const a=document.createElement('a');a.href=bar.dataset.pdfUrl;a.target='_blank';a.rel='noopener';a.textContent=' Open PDF';status.append(a);}};
async function directPrint(){if(button.disabled)return;button.disabled=true;show('Sending to '+select.options[select.selectedIndex].text+'…');
 try{const r=await fetch(bar.dataset.printUrl,{method:'POST',headers:{'X-CSRFToken':csrf},body:new URLSearchParams({printer:select.value})});
  const d=await r.json().catch(()=>({error:'The print request failed. Reload the page and try again.'}));show(d.error||d.message,!r.ok,!r.ok);}
 catch{show('Could not reach the app server. Check the connection before retrying.',true,true);}
 finally{button.disabled=false;}}
if(button&&!button.disabled)button.addEventListener('click',directPrint);
if(bar.dataset.autoPrint){if(button&&!button.disabled)directPrint();else show('No Letter printer is set up.',true,true);const u=new URL(location.href);u.searchParams.delete('print');history.replaceState(null,'',u);}
})();
</script>{% endif %}
{% if doc and kind == 'po' %}<div class="export-bar no-print" id="label-print-bar" data-print-url="/purchasing/po/{{ doc.token }}/labels/print/"><span class="label">Item Labels</span><span class="hint">one per piece, SL548 sheets</span><select id="label-printer" aria-label="Label printer" {% if not printers %}disabled{% endif %}>{% for p in printers %}<option value="{{ p.pk }}" {% if label_selected_printer == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% empty %}<option value="">No Letter printers</option>{% endfor %}</select><label class="copies">Copies <input id="label-copies" type="number" min="1" max="5" step="1" value="1" inputmode="numeric"></label><button class="button" type="button" id="label-print" {% if not printers %}disabled title="No Letter printers are set up"{% endif %}>Print Labels</button><form id="label-preview" method="post" action="/purchasing/po/{{ doc.token }}/labels/pdf/" target="_blank">{% csrf_token %}<input type="hidden" name="copies" value="1"><button class="button" type="submit">Preview PDF</button><label class="outlines"><input type="checkbox" name="outlines" value="1"> Show label outlines</label></form><a href="/purchasing/labels/alignment/" target="_blank" rel="noopener">Alignment test sheet</a><span class="print-status" id="label-print-status" role="status" hidden></span></div>
<style>#label-print-bar .hint{color:#6b7480;font-size:12px}#label-print-bar form{display:flex;gap:8px;align-items:center;margin:0}#label-print-bar label{display:flex;gap:4px;align-items:center}#label-print-bar input[type=number]{width:52px;padding:5px;font:inherit}#label-print-bar input[type=checkbox]{margin:0}</style>
<script>
(()=>{const bar=document.getElementById('label-print-bar');if(!bar)return;const button=document.getElementById('label-print'),select=document.getElementById('label-printer'),copies=document.getElementById('label-copies'),status=document.getElementById('label-print-status'),preview=document.getElementById('label-preview'),csrf=preview.querySelector('[name=csrfmiddlewaretoken]').value;
const show=(text,bad)=>{status.textContent=text;status.hidden=false;status.classList.toggle('bad',!!bad);};
const count=()=>{const n=parseInt(copies.value,10);return n>=1&&n<=5?String(n):null;};
preview.addEventListener('submit',e=>{const n=count();if(!n){e.preventDefault();show('Copies must be 1 to 5.',true);return;}preview.querySelector('[name=copies]').value=n;});
async function printLabels(){if(button.disabled)return;const n=count();if(!n){show('Copies must be 1 to 5.',true);return;}button.disabled=true;show('Sending labels to '+select.options[select.selectedIndex].text+'…');
 try{const r=await fetch(bar.dataset.printUrl,{method:'POST',headers:{'X-CSRFToken':csrf},body:new URLSearchParams({printer:select.value,copies:n})});
  const d=await r.json().catch(()=>({error:'The print request failed. Reload the page and try again.'}));show(d.error||d.message,!r.ok);}
 catch{show('Could not reach the app server. Check the connection before retrying.',true);}
 finally{button.disabled=false;}}
if(button&&!button.disabled)button.addEventListener('click',printLabels);
})();
</script>{% endif %}
