<dialog id="item-picker" aria-labelledby="item-picker-title" style="width:min(1250px,95vw)"><h2 id="item-picker-title">Select from Item List</h2><form id="item-picker-search" class="tools"><input type="search" id="item-picker-query" placeholder="Search item name or description" aria-label="Search item list"><button class="button">Search</button><span id="item-picker-selection" role="status"></span></form><div id="item-picker-scroll" style="max-height:60vh;overflow:auto" tabindex="0" role="region" aria-label="Scrollable item list"><table><thead><tr><th id="item-picker-first">Select</th><th>Item Name</th><th>Item Description</th><th>On-hand Qty</th><th>Available</th><th>Regular Price</th><th>On Order</th><th>Last Received</th></tr></thead><tbody id="item-picker-rows"></tbody></table></div><div class="notice" id="item-picker-status" role="status"></div><div class="actions"><button type="button" class="button left" id="item-picker-retry" hidden>Retry</button><button type="button" class="button" id="item-picker-cancel">Cancel</button><button type="button" class="button primary" id="item-picker-add" disabled>Add Selected Items</button></div></dialog>
<script>(()=>{const dialog=document.getElementById('item-picker'),viewport=document.getElementById('item-picker-scroll'),body=document.getElementById('item-picker-rows'),search=document.getElementById('item-picker-query'),status=document.getElementById('item-picker-status'),retry=document.getElementById('item-picker-retry'),add=document.getElementById('item-picker-add'),chosen=new Map();let callback,options={},page=0,pages=1,count=0,controller,serial=0,loading=false;
function selected(){let units=0;for(const item of chosen.values())units+=Number(item.quantity||1);document.getElementById('item-picker-selection').textContent=options.quantity?chosen.size+' item'+(chosen.size===1?'':'s')+' · '+units+' unit'+(units===1?'':'s'):chosen.size+' selected';add.disabled=!chosen.size;}
function full(){if(chosen.size<(options.limit??100))return false;status.textContent='This document has room for '+(options.limit??100)+' more items.';return true;}
function report(){status.textContent=count?count+' items · '+body.rows.length+' shown · '+(page<pages?'Scroll to browse more items':'End of item list'):'No matching items';}
function row(item){const tr=document.createElement('tr'),td=document.createElement('td');if(options.quantity){const qty=document.createElement('input');qty.type='number';qty.min='1';qty.max='99999999';qty.step='1';qty.inputMode='numeric';qty.style.width='5.5em';qty.placeholder='Qty';qty.setAttribute('aria-label','Quantity to order for '+item.label);qty.value=chosen.get(item.id)?.quantity||'';qty.onfocus=()=>{if(!qty.value&&!full()){qty.value='1';qty.select();qty.dispatchEvent(new Event('input'));}};qty.oninput=()=>{const value=qty.value.trim();if(/^\d+$/.test(value)&&Number(value)>0){if(!chosen.has(item.id)&&full()){qty.value='';return;}chosen.set(item.id,{...item,quantity:value});}else chosen.delete(item.id);selected();};td.append(qty);}else{const check=document.createElement('input');check.type='checkbox';check.checked=chosen.has(item.id);check.setAttribute('aria-label','Select '+item.label);check.onchange=()=>{if(check.checked){if(full()){check.checked=false;return;}chosen.set(item.id,item);}else chosen.delete(item.id);selected();};td.append(check);}tr.append(td);for(const value of [item.label,item.description,item.on_hand??'Unverified',item.available??'Unverified',item.price===''?'Enter price':'$'+item.price,item.on_order,item.last_received||'—']){const cell=document.createElement('td');cell.textContent=value;cell.style.whiteSpace='normal';cell.style.minWidth=value===item.description?'300px':'110px';tr.append(cell);}return tr;}
// Continuous scrolling: each batch is appended below the previous one; selections persist across batches.
async function load(reset){if(reset){controller?.abort();serial++;page=0;pages=1;count=0;loading=false;body.replaceChildren();viewport.scrollTop=0;}if(loading||page>=pages)return;loading=true;retry.hidden=true;const run=serial,next=page+1;controller=new AbortController();status.textContent='Loading items…';viewport.setAttribute('aria-busy','true');try{const response=await fetch('/purchasing/item-picker/?'+new URLSearchParams({q:search.value,page:next,vendor:options.vendor||''}),{signal:controller.signal});if(!response.ok)throw Error();const data=await response.json();if(run!==serial)return;page=data.page;pages=data.pages;count=data.count;const fragment=document.createDocumentFragment();for(const item of data.results)fragment.append(row(item));body.append(fragment);report();}catch(e){if(e.name==='AbortError'||run!==serial)return;status.textContent='Could not load more items. Select Retry or press Search.';retry.hidden=false;}finally{if(run===serial){loading=false;viewport.setAttribute('aria-busy','false');more();}}}
function more(){if(!dialog.open||loading||page>=pages||!retry.hidden)return;if(viewport.scrollTop+viewport.clientHeight>=viewport.scrollHeight-240)void load(false);}
viewport.addEventListener('scroll',more,{passive:true});
if(window.ResizeObserver)new ResizeObserver(more).observe(viewport);
retry.onclick=()=>{retry.hidden=true;void load(false);};
window.openItemPicker=(fn,opts={})=>{callback=fn;options=opts;chosen.clear();search.value='';document.getElementById('item-picker-first').textContent=opts.quantity?'Qty':'Select';selected();document.querySelectorAll('.action-menu').forEach(d=>d.open=false);dialog.showModal();void load(true);};document.getElementById('item-picker-search').onsubmit=e=>{e.preventDefault();void load(true);};document.getElementById('item-picker-cancel').onclick=()=>dialog.close();add.onclick=()=>{callback([...chosen.values()]);dialog.close();};})();</script>
