<dialog id="item-editor-modal" aria-label="Inventory item"><div class="modal-heading"><strong>Inventory Item</strong><button type="button" class="button" id="close-item-editor">Close</button></div><iframe title="Inventory item form"></iframe></dialog><style>.item-saved-note{background:#e3f4e7;border:1px solid #9cc9a8;color:#1b4b34;padding:3px 8px;border-radius:3px;font-weight:bold;align-self:center}</style>
<script>
(()=>{
const selected=new Set(),viewport=document.getElementById('item-scroll'),modal=document.getElementById('item-editor-modal'),frame=modal.querySelector('iframe');let changed=false;
const panel=document.getElementById('item-details'),content=document.getElementById('item-details-content'),detailsButton=document.querySelector('[data-item-action=details]'),DETAILS_KEY='freedomshop.itemDetailsOpen';let shownId=null,pending=null,wantOrders=null;
function openOrdersPopup(){const box=content.querySelector('dialog[data-popup="orders"]');if(!box)return;content.querySelectorAll('dialog[open]').forEach(d=>d.close());const f=box.querySelector('[data-orders-filter]');if(f){f.value='po';f.dispatchEvent(new Event('change',{bubbles:true}));}box.showModal();}
function emptyDetails(text){pending?.abort();content.innerHTML='';const p=document.createElement('p');p.className='item-details-empty';p.textContent=text;content.append(p);}
function refreshDetails(){if(panel.hidden)return;if(selected.size!==1){const key='none:'+selected.size;if(shownId!==key){shownId=key;emptyDetails(selected.size?selected.size+' items selected. Select one item to see its details.':'Select an item in the list to see its details.');}return;}const id=[...selected][0];if(id===shownId)return;shownId=id;pending?.abort();const request=pending=new AbortController();content.setAttribute('aria-busy','true');fetch('/purchasing/items/'+id+'/details/',{signal:request.signal}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(html=>{if(shownId!==id)return;content.innerHTML=html;content.scrollTop=0;if(wantOrders===id){wantOrders=null;openOrdersPopup();}}).catch(e=>{if(e.name!=='AbortError'&&shownId===id){shownId=null;emptyDetails('Could not load this item. Select it again to retry.');}}).finally(()=>{if(pending===request)content.removeAttribute('aria-busy');});}
function showDetails(open){panel.hidden=!open;detailsButton.textContent=open?'Hide Details':'Show Details';detailsButton.setAttribute('aria-pressed',String(open));try{localStorage.setItem(DETAILS_KEY,open?'1':'0');}catch(e){}if(open){shownId=null;refreshDetails();}}
panel.querySelector('[data-detail-close]').onclick=()=>showDetails(false);
content.addEventListener('click',e=>{const edit=e.target.closest('[data-detail-edit]');if(edit)return openEditor('/purchasing/items/'+edit.dataset.detailEdit+'/');const open=e.target.closest('[data-detail-popup]');if(open){content.querySelectorAll('dialog[open]').forEach(d=>d.close());content.querySelector('dialog[data-popup="'+open.dataset.detailPopup+'"]')?.showModal();return;}if(e.target.closest('[data-popup-close]'))e.target.closest('dialog')?.close();});
content.addEventListener('change',e=>{const f=e.target.closest('[data-orders-filter]');if(!f)return;const box=f.closest('dialog');let shown=0;box.querySelectorAll('tr[data-order-kind]').forEach(r=>{r.hidden=f.value!=='all'&&r.dataset.orderKind!==f.value;if(!r.hidden)shown++;});box.querySelector('.detail-orders-empty').hidden=shown>0;});
content.addEventListener('dblclick',e=>{const r=e.target.closest('tr[data-href]');if(r)location.href=r.dataset.href;});
content.addEventListener('keydown',e=>{const r=e.target.closest('tr[data-href]');if(r&&e.key==='Enter')location.href=r.dataset.href;});
function update(){document.getElementById('selected-count').textContent=selected.size+' selected';document.querySelectorAll('[data-item-action]').forEach(b=>b.disabled=!['add','details'].includes(b.dataset.itemAction)&&selected.size!==1);document.querySelectorAll('[data-selected-target]').forEach(b=>b.disabled=!selected.size);viewport.querySelectorAll('tr').forEach(r=>{const c=r.querySelector('.item-select');if(c){c.checked=selected.has(c.value);r.classList.toggle('catalog-selected',c.checked);}});refreshDetails();}
function clear(){selected.clear();update();}
window.freedomshopItemCheckbox=(id,name)=>{const c=document.createElement('input');c.type='checkbox';c.value=String(id);c.className='item-select';c.checked=selected.has(c.value);c.setAttribute('aria-label','Select '+name);c.style.marginRight='8px';c.addEventListener('change',()=>{if(c.checked)selected.add(c.value);else selected.delete(c.value);update();});return c;};
document.querySelectorAll('[data-item-select]').forEach(cell=>cell.prepend(window.freedomshopItemCheckbox(cell.dataset.itemSelect,cell.textContent.trim())));
new MutationObserver(()=>update()).observe(viewport.tBodies||viewport,{childList:true,subtree:true});
function openEditor(url){if(!{{ register_rights.edit_items|yesno:'true,false' }}){showDetails(true);return;}frame.src=url+(url.includes('?')?'&':'?')+new URLSearchParams({modal:'1',return_to:location.pathname+location.search});changed=false;modal.showModal();}
function close(){modal.close();frame.src='about:blank';if(changed)location.reload();}
document.getElementById('close-item-editor').onclick=close;modal.addEventListener('cancel',e=>{e.preventDefault();close();});
// after the pop-up saves, the list reloads and says so ("Item saved" / "Item added") and selects the saved item.
const SAVED_KEY='freedomshop.itemSaved';
function rememberSaved(note){try{sessionStorage.setItem(SAVED_KEY,JSON.stringify(note));}catch(e){}}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data?.type==='item-modal-saved'){changed=true;rememberSaved({id:String(e.data.id||''),text:e.data.added?'Item added':'Item saved'});close();}if(e.data?.type==='item-modal-next'){changed=true;rememberSaved({id:'',text:'Item added'});}if(e.data?.type==='item-modal-close')close();});
(()=>{let note=null;try{note=JSON.parse(sessionStorage.getItem(SAVED_KEY)||'null');sessionStorage.removeItem(SAVED_KEY);}catch(e){}if(!note||!note.text)return;
 const count=document.getElementById('selected-count'),box=document.createElement('span');box.className='item-saved-note';box.setAttribute('role','status');box.textContent=note.text+'.';count.after(box);setTimeout(()=>box.remove(),10000);
 if(/^\d{1,18}$/.test(note.id)&&note.text==='Item saved'){selected.clear();selected.add(note.id);}})();  // a new item may not match the search, so only an edited one is selected
viewport.addEventListener('click',e=>{const row=e.target.closest('tr'),c=row?.querySelector('.item-select');if(!c||e.target===c)return;if(e.target.closest('a'))e.preventDefault();if(!e.ctrlKey&&!e.metaKey&&!e.shiftKey)selected.clear();selected.add(c.value);
 // clicking an On Order quantity (QB's gesture) selects the item, opens the details panel and its Orders pop-up.
 const ordersCell=e.target.closest('[data-item-orders]');if(ordersCell&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){wantOrders=c.value;if(panel.hidden)showDetails(true);}
 update();if(wantOrders&&shownId===wantOrders&&!content.hasAttribute('aria-busy')){wantOrders=null;openOrdersPopup();}});
viewport.addEventListener('dblclick',e=>{const c=e.target.closest('tr')?.querySelector('.item-select');if(c)openEditor('/purchasing/items/'+c.value+'/');});
document.querySelector('[data-select-visible]').onclick=()=>{viewport.querySelectorAll('.item-select').forEach(c=>{const box=c.getBoundingClientRect(),v=viewport.getBoundingClientRect();if(box.bottom>v.top&&box.top<v.bottom)selected.add(c.value);});update();};document.querySelector('[data-clear-selection]').onclick=clear;
document.querySelectorAll('[data-item-action]').forEach(b=>b.onclick=()=>{const id=[...selected][0],action=b.dataset.itemAction;if(action==='add')return openEditor('/purchasing/items/new/');if(action==='details')return showDetails(panel.hidden);if(selected.size!==1)return;if(action==='copy')openEditor('/purchasing/items/new/?copy='+id);if(action==='edit')openEditor('/purchasing/items/'+id+'/');});
document.querySelectorAll('[data-selected-target]').forEach(b=>b.onclick=()=>{if(!selected.size)return;if(selected.size>100){alert('Choose no more than 100 items per document.');return;}const p=new URLSearchParams();selected.forEach(id=>p.append('item',id));if(b.dataset.selectedBack)p.append('back',location.pathname+location.search);location.href=b.dataset.selectedTarget+'?'+p;});
let startOpen=false;try{startOpen=localStorage.getItem(DETAILS_KEY)==='1';}catch(e){}update();showDetails(startOpen);
})();
</script>
