# SPDX-License-Identifier: AGPL-3.0-or-later
# CLA Assistant Lite: asks each pull request author to sign CLA.md once and records signatures
# on the cla-signatures branch. It never checks out or runs pull request code.
name: CLA
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/CyberJody/FreedomShop/blob/main/CLA.md
          branch: cla-signatures
          allowlist: CyberJody,dependabot[bot]
